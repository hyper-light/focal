[workspace]
members = ["crates/*", "tools/*"]
# The shared crates vendored from hyper-raft are roots of their own (SNAPSHOT in each).
exclude = [
    "vendor/hyper-block",
    "vendor/hyper-durable",
    "vendor/hyper-liveness",
    "vendor/hyper-log",
    "vendor/hyper-raft",
    "vendor/hyper-seal",
    "vendor/hyper-timing",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/hyper-light/focal"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
getrandom = "0.3"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
postcard = { version = "1.1", features = ["alloc", "use-std"] }
# The durable shell around the core, vendored from hyper-raft with the log and
# block layers and the liveness stream it builds on (vendor/*/SNAPSHOT; 27 §15).
hyper-block = { version = "0.1.0", path = "vendor/hyper-block" }
hyper-durable = { version = "0.1.0", path = "vendor/hyper-durable" }
hyper-log = { version = "0.1.0", path = "vendor/hyper-log" }
# Sealing at rest, vendored from hyper-raft (vendor/hyper-seal/SNAPSHOT;
# docs/archictecutre/29-sealing-at-rest.md).
hyper-seal = { version = "0.1.0", path = "vendor/hyper-seal" }
# The consensus core, vendored from hyper-raft (vendor/hyper-raft/SNAPSHOT;
# 27 §4.2): focal's core moved there and is shared with mantle and slates.
hyper-raft = { version = "0.1.0", path = "vendor/hyper-raft" }
# raft-rs 0.7's message and log types, for focal-consensus's tests alone: the
# oracle its envelope codec is held to byte for byte, since focal's WAL and
# wire keep raft-rs's protobuf encoding (focal-consensus/src/envelope.rs).
# Upstream PR #578; provenance: docs/dependencies/raft-upstream.md.
raft-proto = { version = "0.7.0", git = "https://github.com/tikv/raft-rs", rev = "8e4cef172421bf77b2ae1c26628a9531b0be41f0", default-features = false, features = ["prost-codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_saphyr = { package = "serde-saphyr", version = "1.2", default-features = false, features = ["deserialize"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs"] }

[workspace.lints.rust]
# Denied everywhere and allowed in exactly one audited file,
# crates/focal-platform/src/windows.rs (decision 11, doc 10);
# scripts/check-contracts.py fails if `unsafe` appears anywhere else.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

# The crypto provider is built from the sources checked into `vendor/`, byte
# for byte the crates.io archives whose checksums `vendor/README.md` records,
# so a release is built from what was reviewed and can be built offline.
[patch.crates-io]
aws-lc-rs = { path = "vendor/aws-lc-rs" }
aws-lc-sys = { path = "vendor/aws-lc-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# Keep repeated local qualification builds practical on a laptop. Opt in to
# debug symbols when diagnosing a native stack; release correctness is unchanged.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
