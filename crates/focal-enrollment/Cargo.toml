[package]
name = "focal-enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
focal-memory = { version = "0.1.0", path = "../focal-memory" }
focal-platform = { version = "0.1.0", path = "../focal-platform" }
focal-wire = { version = "0.1.0", path = "../focal-wire" }
hyper-rt.workspace = true
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "x509-parser", "zeroize"] }
# hyper-raft's conformed rustls, as focal-wire names it: the configurations built here are its
# endpoint's.
rustls = { package = "hyper-tls", version = "0.1.0", path = "../../vendor/hyper-tls" }
time = { version = "0.3", default-features = false }
x509-parser = { version = "0.18", features = ["verify-aws"] }
zeroize = "1.8"
aws-lc-rs = "1.18"

[dev-dependencies]
tempfile.workspace = true
focal-log = { version = "0.1.0", path = "../focal-log" }
focal-rt = { version = "0.1.0", path = "../focal-rt" }

[lints]
workspace = true
