[package]
name = "focal-enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
focal-platform = { version = "0.1.0", path = "../focal-platform" }
focal-wire = { version = "0.1.0", path = "../focal-wire" }
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "x509-parser", "zeroize"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
time = { version = "0.3", default-features = false }
x509-parser = { version = "0.18", features = ["verify-aws"] }
zeroize = "1.8"
aws-lc-rs = "1.18"

[dev-dependencies]
tempfile.workspace = true
focal-log = { version = "0.1.0", path = "../focal-log" }

[lints]
workspace = true
