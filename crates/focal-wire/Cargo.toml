[package]
name = "focal-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
focal-model = { version = "0.1.0", path = "../focal-model" }
focal-memory = { version = "0.1.0", path = "../focal-memory", features = ["serde"] }
focal-platform = { version = "0.1.0", path = "../focal-platform" }
focal-rt = { version = "0.1.0", path = "../focal-rt" }
focal-timing = { version = "0.1.0", path = "../focal-timing" }
focal-stream = { version = "0.1.0", path = "../focal-stream" }
blake3.workspace = true
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
hyper-quic.workspace = true
hyper-rt.workspace = true
hyper-rt-transport.workspace = true
hyper-transport.workspace = true
# Each endpoint's owner runs on a heap of its own, whose bytes in use its endpoint observes as what
# its connections hold (hyper-raft docs/transport.md §4x).
hyper-heap.workspace = true
# hyper-raft's conformed rustls, under the name every configuration here was written against (as
# hyper-quic names it): owned verifiers and resolvers, a &'static provider.
rustls = { package = "hyper-tls", version = "0.1.0", path = "../../vendor/hyper-tls" }
x509-parser = { version = "0.18", features = ["verify-aws"] }
zeroize = "1.8"

[dev-dependencies]
focal-model = { version = "0.1.0", path = "../focal-model" }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs"] }
bytes = "1"
focal-sim = { version = "0.1.0", path = "../focal-sim" }
serde_json.workspace = true
tempfile.workspace = true
# The unit tests allocate through mimalloc, as the focal binary does: its endpoints then run on heaps
# of their own and learn what their connections hold, the path a node takes.
mimalloc.workspace = true

[lints]
workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "allocs"
harness = false
