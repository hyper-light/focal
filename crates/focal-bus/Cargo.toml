[package]
name = "focal-bus"
description = "focal's event bus: claims to their respondents and testaments to their recipients, held in memory, durability off the delivery path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# A batch's checksum, CRC-32C (Castagnoli), hardware-computed (SSE 4.2, ARMv8 CRC32).
crc32c = "0.6"
# What every segment, table and transport byte is charged to.
focal-memory = { version = "0.1.0", path = "../focal-memory" }
# The bus's wire: exchanges and lanes over QUIC (vendor/hyper-transport), driven on a hyper-rt
# shard over its batched UDP socket (hyper-rt-transport).
hyper-transport.workspace = true
hyper-rt.workspace = true
hyper-rt-transport.workspace = true
# The standalone mode's local identities (`pki`).
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }

[dev-dependencies]
# What a benchmark costs, counted where it happens (vendor/hyper-measure): allocations, page
# faults, CPU, and the noise band two sets of runs must clear before they differ.
hyper-measure.workspace = true
# Waits charged to the progress of what they wait on (the loopback test).
focal-timing = { version = "0.1.0", path = "../focal-timing" }
serde_json.workspace = true
# The edge codec under study (docs/archictecutre/32-event-bus.md §codec): claimants and respondents
# compress, the bus never does, so it is a dev-dependency of the bus itself.
zstd.workspace = true

[lints]
workspace = true

# Step 0 of the event bus: what the dense JSON a claim or a testament carries costs to send, per
# message and per batch, raw and compressed at the edges; a table, not a criterion run.
[[bench]]
name = "codec"
harness = false

# Step 1: the in-memory core, quiet and contended; a table.
[[bench]]
name = "inmemory"
harness = false
