[package]
name = "focal-directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
focal-model = { version = "0.1.0", path = "../focal-model" }
focal-enrollment = { version = "0.1.0", path = "../focal-enrollment" }
focal-memory = { version = "0.1.0", path = "../focal-memory", features = ["serde"] }
serde = { workspace = true, features = ["rc"] }
postcard.workspace = true
blake3.workspace = true

[dev-dependencies]
focal-seal = { version = "0.1.0", path = "../focal-seal", features = ["test-support"] }
tempfile.workspace = true
focal-consensus = { version = "0.1.0", path = "../focal-consensus" }
# hyper-raft's conformed rustls, as focal-enrollment builds its configurations with.
rustls = { package = "hyper-tls", version = "0.1.0", path = "../../vendor/hyper-tls" }

[lints]
workspace = true
