[package]
name = "focal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
focal-model = { version = "0.1.0", path = "../focal-model" }
focal-memory = { version = "0.1.0", path = "../focal-memory" }
focal-evidence = { version = "0.1.0", path = "../focal-evidence" }
serde.workspace = true
blake3.workspace = true
crc32fast.workspace = true
thiserror.workspace = true
postcard.workspace = true

[dev-dependencies]
# The keys of a test's data directory, which every content store is sealed under (29 §11).
focal-seal = { version = "0.1.0", path = "../focal-seal", features = ["test-support"] }
focal-model = { version = "0.1.0", path = "../focal-model" }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# Public, fallible workflow fixtures for integration tests in other crates.
# Never enabled by production binaries.
test-support = []

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "allocs"
harness = false
