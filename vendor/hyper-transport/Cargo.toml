[package]
name = "hyper-transport"
version = "0.1.0"
edition = "2024"
# focal's toolchain (rust-toolchain.toml); this snapshot builds on it, which focal's gates show.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"

[features]
oracle = []

[dependencies]
hyper-quic = { version = "0.1.0", path = "../hyper-quic" }
hyper-timing = { version = "0.1.0", path = "../hyper-timing" }
# The QUIC layer takes a received datagram as BytesMut (hyper-quic's own dependency).
bytes = "1"
crc-fast = { version = "1.10", default-features = false, features = ["std", "vpclmulqdq"] }
thiserror = "2.0"

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside focal's workspace. Its
# suites, benchmarks and lint wall run in hyper-raft's repository, on all six targets.
[workspace]
