[package]
name = "hyper-raft"
description = "A Raft core with no clock, disk or network, shared by slates, focal and mantle."
version = "0.1.0"
edition = "2024"
# focal's toolchain (rust-toolchain.toml); this snapshot builds on it, which focal's gates show.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"

[features]
# The planted defects of `src/mutant.rs`, for hyper-raft's tests that show its oracles catch them.
# focal never enables it.
mutants = []
# raft-rs's precedence of length in elections, for hyper-raft's differential tests against raft-rs
# (docs/raft.md §3.3). It can leave a group that could elect without a leader; focal never enables it.
raft-rs-precedence = []

[dependencies]
crc32c = "0.6"
hyper-timing = { version = "0.1.0", path = "../hyper-timing" }
thiserror = "2.0"

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside focal's workspace. Its
# suites, benchmarks and lint wall run in hyper-raft's repository, on all six targets.
[workspace]
