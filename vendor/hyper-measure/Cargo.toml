[package]
name = "hyper-measure"
version = "0.1.0"
edition = "2024"
# focal's toolchain (rust-toolchain.toml); this snapshot builds on it, which focal's gates show.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"

# Measurement only: focal's benchmarks and tests take it as a dev-dependency, no shipped crate does.

[target.'cfg(unix)'.dependencies]
# getrusage(2) and, on macOS, task_info(3) from the Mach interface.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# hyper-raft's workspace declares the configurations its model checks and fuzzers build under
# (its Cargo.toml [workspace.lints.rust]); this root declares the same.
[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)", "cfg(shuttle)", "cfg(fuzzing)"] }

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside focal's workspace. Its
# suites, benchmarks and lint wall run in hyper-raft's repository, on all six targets.
[workspace]
