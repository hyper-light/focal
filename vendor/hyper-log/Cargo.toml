[package]
name = "hyper-log"
version = "0.1.0"
edition = "2024"
# focal's toolchain (rust-toolchain.toml); this snapshot builds on it, which focal's gates show.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"

[dependencies]
crc32c = "0.6"
getrandom = "0.4"
hyper-block = { version = "0.1.0", path = "../hyper-block" }
# The sealed log's keys, MACs and tags (`Log::create_sealed`, hyper-raft docs/seal.md).
hyper-seal = { version = "0.1.0", path = "../hyper-seal" }
# The histograms the log's statistics keep (`LogStats`, hyper-raft docs/durable.md §13.1).
hyper-timing = { version = "0.1.0", path = "../hyper-timing" }
thiserror = "2.0"

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside focal's workspace. Its
# suites, benchmarks and lint wall run in hyper-raft's repository, on all six targets.
[workspace]
