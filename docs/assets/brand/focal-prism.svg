<svg xmlns="http://www.w3.org/2000/svg" width="194" height="90" viewBox="20 20 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Focal prism logo</title>
  <desc id="desc">A translucent triangular prism with shaded interior faces, three incoming rays, and one outgoing ray.</desc>
  <!-- The rear triangle recedes toward (240, 180) at 76% of the front size.
       All three connecting edges share that vanishing point. Interior faces
       establish volume within the original silhouette; the ray paths are unchanged. -->
  <defs>
    <linearGradient id="glass" x1="168" y1="80" x2="415" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0.02"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="left-face" x1="205" y1="160" x2="260" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="right-face" x1="298" y1="146" x2="424" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="base-face" x1="250" y1="244" x2="250" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.23"/>
    </linearGradient>
  </defs>
  <path d="M 300 36 L 432 264 H 168 Z" fill="url(#glass)"/>
  <path d="M 300 36 L 285.6 70.56 L 185.28 243.84 L 168 264 Z" fill="url(#left-face)"/>
  <path d="M 300 36 L 432 264 L 385.92 243.84 L 285.6 70.56 Z" fill="url(#right-face)"/>
  <path d="M 168 264 L 185.28 243.84 H 385.92 L 432 264 Z" fill="url(#base-face)"/>
  <path d="M 285.6 70.56 L 385.92 243.84 H 185.28 Z M 300 36 L 285.6 70.56 M 168 264 L 185.28 243.84 M 432 264 L 385.92 243.84" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.25" stroke-linejoin="miter"/>
  <g fill="none" stroke="#000000" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 300 36 L 432 264 H 168 Z" stroke-width="6"/>
    <g stroke-width="4.5">
    <path d="M 40 124 H 249.052632 L 370.631579 158"/>
    <path d="M 40 164 H 225.894737 L 370.631579 158"/>
    <path d="M 40 204 H 202.736842 L 370.631579 158"/>
    </g>
    <path d="M 370.631579 158 H 560" stroke-width="5"/>
  </g>
</svg>
