<svg xmlns="http://www.w3.org/2000/svg" width="194" height="90" viewBox="20 20 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Focal prism logo</title>
  <desc id="desc">A triangular prism with a shallow side face and three straight incoming light paths converging into one outgoing ray.</desc>
  <!-- The front profile and ray paths follow the accepted Newton-inspired mark.
       The rear triangle is the front triangle translated by (28, -10).
       Only its visible right edge and the two parallel joining edges are drawn.
       A faint side fill and lighter far edges establish depth. -->
  <path d="M 300 36 L 328 26 L 460 254 L 432 264 Z" fill="#f0f6fc" fill-opacity="0.08"/>
  <path d="M 300 36 L 328 26 L 460 254 L 432 264" fill="none" stroke="#f0f6fc" stroke-width="3.5" stroke-opacity="0.55" stroke-linecap="butt" stroke-linejoin="miter"/>
  <g fill="none" stroke="#f0f6fc" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 300 36 L 432 264 H 168 Z" stroke-width="6"/>
    <g stroke-width="4.5">
    <path d="M 40 124 H 249.052632 L 370.631579 158"/>
    <path d="M 40 164 H 225.894737 L 370.631579 158"/>
    <path d="M 40 204 H 202.736842 L 370.631579 158"/>
    </g>
    <path d="M 370.631579 158 H 560" stroke-width="5"/>
  </g>
</svg>
