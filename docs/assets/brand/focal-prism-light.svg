<svg xmlns="http://www.w3.org/2000/svg" width="194" height="90" viewBox="20 20 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Focal prism logo</title>
  <desc id="desc">An open triangular prism with three straight incoming light paths converging into one outgoing ray.</desc>
  <!-- End-on prism profile, following the user's Newton artwork reference.
       Ray entry and exit points are intersections with the two sloping sides.
       The drawing uses straight segments only and has a transparent interior. -->
  <g fill="none" stroke="#1f2328" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 300 36 L 432 264 H 168 Z" stroke-width="6"/>
    <g stroke-width="4.5">
    <path d="M 40 124 H 249.052632 L 370.631579 158"/>
    <path d="M 40 164 H 225.894737 L 370.631579 158"/>
    <path d="M 40 204 H 202.736842 L 370.631579 158"/>
    </g>
    <path d="M 370.631579 158 H 560" stroke-width="5"/>
  </g>
</svg>
