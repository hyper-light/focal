\* Three voters, three terms, one index: elections, and what one that is
\* elected takes. The fast quorum of three is all of them, and with one
\* index no entry is committed by what members hold by themselves (a member
\* whose log is of the leader's term holds the index from the leader):
\* FastTrackRound.cfg checks that.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Values = {v1, v2}
  Noop = Noop
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 1
  Rule = "most"
  Counts = "round"
  StateBudget = 560563
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
