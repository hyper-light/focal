# Competitive tail latency on kiln, from .github/workflows/compare.yml
# (docs/qualification/competitive-p99.md): focal, Kafka, NATS JetStream and Redis on equal terms,
# every acknowledged write on disk at a quorum, each system measured on the same host one after
# another. Runs on the bare-metal bench host, whose docker daemon builds and runs the containers.
#
# Adapted from GHA:
# - No GHCR mirror or login (tools/compare/compose/mirror.sh needs the workflow's token): the
#   public sources are used, as the GHA workflow itself falls back to when the mirror fails.
# - The image is built into the host's docker (BuildKit's cache mounts persist between runs)
#   and not passed as an artifact: both jobs run on the one bench host.
# - The step summary is written to reports/summary.md, uploaded with the reports.
# - GHA's workflow_dispatch inputs are the measure job's env, at their defaults.
name: compare
on:
  # A branch named compare/<anything> runs it with the defaults below; one named
  # compare/deliver-<anything> runs the deliver mode at its own rates.
  push: { branches: ["compare/**"] }
  manual: true
# compare and compare-ab tag the same `focal:bench` image in the host's docker: one run at a time.
concurrency:
  group: focal-bench-docker
  cancel-in-progress: false
jobs:
  image:
    name: focal:bench image
    runs-on: [baremetal, bench]
    # The build, and the base images' pulls waiting out a registry's rate limit.
    timeout-minutes: 150
    steps:
      # The node, focal-load and focal-compare, built as the release's musl lane builds them
      # (tools/compare/compose/focal.Dockerfile).
      - name: Build focal:bench
        run: |
          docker build --progress=plain \
            -f tools/compare/compose/focal.Dockerfile \
            --build-arg BASE=public.ecr.aws/docker/library \
            -t focal:bench .

  measure:
    needs: [image]
    runs-on: [baremetal, bench]
    exclusive: true
    timeout-minutes: 300
    env:
      NODE_CPUS: "1"
      # compose.yaml's public sources (GHA uses these when no mirror is available).
      BENCH_LIBRARY: public.ecr.aws/docker/library
      BENCH_KAFKA: apache/kafka
      # GHA's dispatch inputs, at their defaults. RATES and MODE follow the branch unless set.
      SYSTEMS: "focal kafka nats redis"
      RUN_SECONDS: "60"
      WARMUP: "15"
      PAYLOAD: "128"
    artifacts: ["tools/compare/compose/reports/**"]
    steps:
      - name: The image built for this run
        run: docker image inspect focal:bench >/dev/null && echo "focal:bench is here"
      - name: The disk the runs write to
        # /tmp is tmpfs on this host: the probe writes to the job's TMPDIR, on the agent's disk.
        run: |
          mkdir -p tools/compare/compose/reports
          {
            df -h /var/lib/docker || df -h /
            lsblk -o NAME,ROTA,SIZE,MODEL || true
            # 500 synchronous 4 KiB writes: whether fsync reaches the device
            # here; then three writers at once, as a system's three nodes are.
            echo "one writer:"
            dd if=/dev/zero of="$TMPDIR/dsync" bs=4k count=500 oflag=dsync 2>&1 | tail -1
            echo "three writers at once:"
            for i in 1 2 3; do
              dd if=/dev/zero of="$TMPDIR/dsync$i" bs=4k count=500 oflag=dsync 2>&1 | tail -1 &
            done
            wait
            rm -f "$TMPDIR/dsync" "$TMPDIR/dsync1" "$TMPDIR/dsync2" "$TMPDIR/dsync3"
          } | tee tools/compare/compose/reports/disk.txt
      - name: Runs
        # Continues on error so the table below is still written (GHA: `if: always()`); the table's
        # step then fails the job when a run failed.
        continue-on-error: true
        run: |
          touch .runs-failed
          case "$KILN_BRANCH" in
            compare/deliver*) mode=deliver rates="50 100 200 400" ;;
            *) mode=append rates="100 200 1000 4000" ;;
          esac
          export MODE="${MODE:-$mode}"
          for system in $SYSTEMS; do
            for rate in ${RATES:-$rates}; do
              bash tools/compare/compose/run.sh "$system" "$rate" \
                "$RUN_SECONDS" \
                "$WARMUP" \
                "$PAYLOAD" reports
            done
          done
          rm -f .runs-failed
      - name: One table, every system, one runner
        env:
          SUMMARY: tools/compare/compose/reports/summary.md
        run: |
          {
            echo '```'
            cat tools/compare/compose/reports/disk.txt
            echo '```'
          } | tee -a "$SUMMARY"
          python3 - <<'PY' | tee -a "$SUMMARY"
          import json, glob, os
          def cpu(path, writes):
              """The nodes' CPU over a run, from run.sh's cgroup counters taken
              before and after the load: the busiest node's and all nodes'
              microseconds per write and the busiest node's share of the wall
              clock. Dashes where no counters were taken."""
              seen = {}
              try:
                  lines = open(path + ".cpu.txt").read().splitlines()
              except OSError:
                  lines = []
              for line in lines:
                  parts = line.split()
                  if len(parts) == 4 and parts[3].isdigit():
                      phase, container, key, value = parts
                      seen.setdefault(container, {}).setdefault(key, {})[phase] = int(value)
              delta = {c: {k: v["after"] - v["before"] for k, v in keys.items() if len(v) == 2}
                       for c, keys in seen.items()}
              wall = delta.pop("-", {}).get("wall_usec", 0)
              nodes = [d["usage_usec"] for c, d in delta.items()
                       if "usage_usec" in d and "focal-load" not in c and "generator" not in c]
              if not nodes or writes <= 0 or wall <= 0:
                  return ("–", "–", "–")
              return (max(nodes) / writes, sum(nodes) / writes, 100 * max(nodes) / wall)
          rows = []
          legacy_focal = False
          for path in sorted(glob.glob("tools/compare/compose/reports/*.json")):
              r = json.load(open(path))
              name = os.path.basename(path)[:-5]
              if "latency_ns" in r:  # focal-load
                  m = r.get("measured_writes")
                  if m is None:
                      legacy_focal = True
                  l = m["committed_latency_ns"] if m is not None else r["latency_ns"]
                  counts = m if m is not None else r
                  us = lambda v: v / 1000
                  # The CPU counters span the whole load, warm-up included,
                  # as do the run's committed writes.
                  rows.append((name, r["shape"].get("rate"), counts["committed"], counts["refused"] + counts["unknown"] + counts.get("expired", 0),
                               us(l["p50"]), us(l["p99"]), us(l["p999"]), us(l["max"])) + cpu(path, r["committed"]))
              elif "offered_per_second" in r:  # focal-compare
                  # Every write it sent, warm-up included, as the counters span.
                  rows.append((name, r["offered_per_second"], r["acknowledged"], r["failed"] + r["refused_by_generator"],
                               r["p50_us"], r["p99_us"], r["p999_us"], r["max_us"]) + cpu(path, r["sent"]))
          print("| run | offered/s | acknowledged | failed or refused | p50 µs | p99 µs | p99.9 µs | max µs | busiest node CPU µs/write | all nodes CPU µs/write | busiest node busy % |")
          print("|---|---|---|---|---|---|---|---|---|---|---|")
          for row in rows:
              print("| " + " | ".join(f"{v:,.0f}" if isinstance(v, float) else str(v) for v in row) + " |")
          if legacy_focal:
              print("\nOlder focal reports contain all-attempt latency and whole-phase counts; refusals and warm-up can skew those rows.")
          # Deliver mode: each message from its intended send time to its consumer's
          # acknowledgement confirmed (focal: the testament posted; satisfied as well).
          delivered = []
          for path in sorted(glob.glob("tools/compare/compose/reports/*-deliver.json")):
              r = json.load(open(path))
              d = r.get("deliver")
              if not d:
                  continue
              name = os.path.basename(path)[:-5]
              if "latency_ns" in r:  # focal-load
                  h, f = d["handled_latency_ns"], d["satisfied_latency_ns"]
                  ms = lambda v: v / 1e6
                  delivered.append((name, r["shape"].get("rate"), d["delivered"], d["undelivered"] + r["refused"] + r["unknown"] + r["abandoned"],
                                    ms(h["p50"]), ms(h["p99"]), ms(h["p999"]), ms(f["p50"]), ms(f["p99"]), ms(f["p999"]))
                                   + cpu(path, max(r["lifecycles"], 1))[:2])
              else:  # focal-compare
                  ms = lambda v: v / 1e3
                  delivered.append((name, r["offered_per_second"], d["delivered"], d["undelivered"] + d["failed"],
                                    ms(d["p50_us"]), ms(d["p99_us"]), ms(d["p999_us"]), "–", "–", "–")
                                   + cpu(path, max(r["sent"], 1))[:2])
          if delivered:
              print("\n### Delivered end to end (deliver mode)\n")
              print("| run | offered msg/s | delivered | undelivered or failed | acked p50 ms | p99 ms | p99.9 ms | focal satisfied p50 ms | p99 ms | p99.9 ms | busiest node CPU µs/msg | all nodes CPU µs/msg |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|")
              for row in delivered:
                  print("| " + " | ".join(f"{v:,.1f}" if isinstance(v, float) else str(v) for v in row) + " |")
          PY
          # The runs' own outcome (their step continues on error so this table is written).
          if [ -e .runs-failed ]; then echo "a run failed: see the Runs step" >&2; exit 1; fi
