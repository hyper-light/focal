name: Diag copy bytes
# DIAG (not for merge): land-11c's copy test six times and the 128 kbit/s crossing three times on
# Linux, the warm-up on (hyper-quic patch Q13; the copy test takes the warm-ups' padding out).
on:
  push:
    branches: ["diag/copy-**"]
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build the tests
        run: bash scripts/cargo.sh test -p focal-node --test evidence_quic --locked --no-run
      - name: The copy test, six runs
        run: |
          passed=0
          for i in 1 2 3 4 5 6; do
            out=$(bash scripts/cargo.sh test -p focal-node --test evidence_quic --locked -- --exact a_copy_is_sent_the_chunks_it_lacks_and_none_it_holds --nocapture 2>&1 || true)
            echo "$out" | grep -E "bytes crossed|test result|panicked" || true
            if echo "$out" | grep -q "test result: ok. 1 passed"; then passed=$((passed + 1)); fi
          done
          echo "copy: passed $passed of 6" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$passed" -eq 6
      - name: The 128 kbit/s crossing, three runs
        run: |
          passed=0
          for i in 1 2 3; do
            out=$(bash scripts/cargo.sh test -p focal-node --test evidence_quic --locked -- --exact a_megabyte_chunk_reaches_its_copy_across_128_kbit_per_second --nocapture 2>&1 || true)
            echo "$out" | grep -E "bit/s:|test result|panicked" || true
            if echo "$out" | grep -q "test result: ok. 1 passed"; then passed=$((passed + 1)); fi
          done
          echo "128 kbit/s: passed $passed of 3" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$passed" -eq 3
