name: Interleaved A/B tail latency

# Two focal builds measured on one runner, their runs interleaved: at every
# rate, A then B in the first round and B then A in the second (and so on), so
# the runner's disk, its neighbours and its warmth weigh on both alike. One
# build's comparison run against another's, each on a runner of its own,
# measures the runners: Kafka's p99 at 1,000/s was 10.7 ms in compare run
# 38147352430 and 26.3 ms in 38154875102, the same Kafka on other runners.
#
# A branch named ab/<anything> runs it: B is the pushed commit and A the
# commit named in tools/compare/ab-base (a full SHA). Both sides' nodes are
# driven by B's generator, so only the nodes differ. One named ab/work-<anything>
# runs focal's work mode among 500 agents (run.sh MODE=work), as
# compare/work-<anything> does, at 50 and 100 claims a second.
on:
  push:
    branches: ["ab/**"]
  workflow_dispatch:
    inputs:
      rates:
        description: "Offered records a second, space-separated"
        default: "100 1000 4000"
      rounds:
        description: "Rounds of every rate, each running both sides"
        default: "2"
      seconds:
        description: "Seconds measured per run"
        default: "60"
      warmup:
        description: "Seconds sent and not measured, first"
        default: "15"

permissions:
  contents: read
  # The pinned base images copied into the repository's own registry (mirror.sh).
  packages: write

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        run: |
          sha=$(tr -d '[:space:]' < tools/compare/ab-base)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "tools/compare/ab-base names no full commit" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Both sides on one runner, one after the other: their base images are
  # pulled once (four builds at once, two A/Bs' two sides, met public.ecr.aws's
  # `429 Too Many Requests: Data limit exceeded`), and the second build reuses
  # the first's compiled dependencies in the build's cache mount.
  image:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          path: a
      - uses: actions/checkout@v7.0.1
        with:
          path: b
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every pinned image copied by digest into the repository's registry, once:
      # anonymous pulls from public registries share the runners' limits. A side
      # whose Dockerfile predates BASE ignores it and pulls as it did.
      - id: mirror
        run: bash b/tools/compare/compose/mirror.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/focal-bench" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: a
          file: a/tools/compare/compose/focal.Dockerfile
          tags: focal:bench-a
          load: true
          build-args: BASE=${{ steps.mirror.outputs.BENCH_REGISTRY || 'public.ecr.aws/docker/library' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # B's build reuses A's compiled crates through the build's cache mount,
      # and cargo judges a crate fresh by its sources' times: B was checked
      # out before A was built, so B's sources read as older than A's outputs
      # and B's image carried A's binaries (every A/B from d08dcff on: B's
      # build finished in two seconds). Each file B changes or adds is made
      # newer than A's build, so cargo rebuilds what B changed and what
      # depends on it; a file B removed leaves its crate's sources incomplete,
      # which cargo rebuilds as well.
      - name: B's changes newer than A's build
        run: |
          changed=0
          while IFS= read -r line; do
            case "$line" in
              "Files a/"*" and b/"*" differ")
                path=${line#Files a/}; path=${path%% and b/*}
                touch "b/$path"; changed=$((changed + 1)) ;;
              "Only in b"*)
                dir=${line#Only in }; dir=${dir%%: *}; name=${line#*: }
                find "$dir/$name" -exec touch {} +; changed=$((changed + 1)) ;;
            esac
          done < <(diff -rq --exclude=.git a b || true)
          echo "B differs from A in $changed paths"
          test "$changed" -gt 0
      - uses: docker/build-push-action@v6
        with:
          context: b
          file: b/tools/compare/compose/focal.Dockerfile
          tags: focal:bench-b
          load: true
          build-args: BASE=${{ steps.mirror.outputs.BENCH_REGISTRY || 'public.ecr.aws/docker/library' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The two sides' nodes are different builds, or the comparison
      # measures one build against itself.
      # diag (not for merge): the sides' nodes are one build; their generators differ.
      - name: A's and B's generators differ
        run: |
          a=$(docker run --rm focal:bench-a sha256sum /usr/local/bin/focal-load | cut -d' ' -f1)
          b=$(docker run --rm focal:bench-b sha256sum /usr/local/bin/focal-load | cut -d' ' -f1)
          echo "A's focal-load: $a"
          echo "B's focal-load: $b"
          test "$a" != "$b"
      - run: docker save focal:bench-a focal:bench-b | zstd -T0 -3 > focal-bench-ab.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: focal-bench-ab
          path: focal-bench-ab.tar.zst
          retention-days: 3

  measure:
    needs: [base, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: focal-bench-ab
      - name: Both sides' images
        run: zstd -dc focal-bench-ab.tar.zst | docker load
      - name: The disk the runs write to
        run: |
          mkdir -p tools/compare/compose/reports
          {
            echo "A $(cat tools/compare/ab-base)"
            echo "B ${{ github.sha }}"
            df -h /var/lib/docker || df -h /
            lsblk -o NAME,ROTA,SIZE,MODEL || true
            # The processor the runs share: hosted runners come with different ones, whose cost a
            # write differs by half again (focal's work mode, 2026-10-27), so a run is read beside
            # its processor.
            grep -m1 'model name' /proc/cpuinfo || true
            nproc || true
            echo "one writer:"
            dd if=/dev/zero of=/tmp/dsync bs=4k count=500 oflag=dsync 2>&1 | tail -1
          } | tee tools/compare/compose/reports/disk.txt
      - name: Runs, interleaved
        env:
          NODE_CPUS: "1"
          FOCAL_LOAD_IMAGE: focal:bench-b
          MODE: ${{ startsWith(github.ref_name, 'ab/work') && 'work' || 'append' }}
          AGENTS: ${{ startsWith(github.ref_name, 'ab/work') && '500' || '' }}
        run: |
          rounds=${{ github.event.inputs.rounds || '2' }}
          for round in $(seq 1 "$rounds"); do
            order="a b"
            if [ $((round % 2)) -eq 0 ]; then order="b a"; fi
            for rate in ${{ github.event.inputs.rates || (startsWith(github.ref_name, 'ab/work') && '50 100' || '100 1000 4000') }}; do
              for side in $order; do
                docker tag "focal:bench-$side" focal:bench
                # diag (not for merge): each side its own generator, both homed over the nodes.
                # A failed run is recorded and the rest still run.
                FOCAL_LOAD_IMAGE="focal:bench-$side" bash tools/compare/compose/run.sh focal "$rate" \
                  "${{ github.event.inputs.seconds || '60' }}" \
                  "${{ github.event.inputs.warmup || '15' }}" \
                  128 "reports/$side/$round" || echo "$side round $round at $rate/s failed"
              done
            done
          done
      - name: A beside B, every round
        if: always()
        run: |
          {
            echo '```'
            cat tools/compare/compose/reports/disk.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os, re, statistics
          def cpu(path, writes):
              """The nodes' CPU over a run, from run.sh's cgroup counters taken
              before and after the load: the busiest node's and all nodes'
              microseconds per write, the busiest node's share of the wall
              clock and the milliseconds its quota held it back. None where no
              counters were taken."""
              seen = {}
              try:
                  lines = open(path + ".cpu.txt").read().splitlines()
              except OSError:
                  return None
              for line in lines:
                  parts = line.split()
                  if len(parts) == 4 and parts[3].isdigit():
                      phase, container, key, value = parts
                      seen.setdefault(container, {}).setdefault(key, {})[phase] = int(value)
              delta = {c: {k: v["after"] - v["before"] for k, v in keys.items() if len(v) == 2}
                       for c, keys in seen.items()}
              wall = delta.pop("-", {}).get("wall_usec", 0)
              nodes = [d for c, d in delta.items()
                       if "usage_usec" in d and "focal-load" not in c and "generator" not in c]
              if not nodes or writes <= 0 or wall <= 0:
                  return None
              busiest = max(nodes, key=lambda d: d["usage_usec"])
              return (busiest["usage_usec"] / writes, sum(d["usage_usec"] for d in nodes) / writes,
                      100 * busiest["usage_usec"] / wall, busiest.get("throttled_usec", 0) / 1000)
          rows = {}
          # Each run's report: focal-<rate>-128.json, or with its mode's suffix
          # (focal-<rate>-128-work-agents500.json), not the files beside it.
          reports = [p for p in glob.glob("tools/compare/compose/reports/*/*/focal-*-128*.json")
                     if re.fullmatch(r"focal-\d+-128(-[a-z0-9]+)*\.json", os.path.basename(p))]
          for path in reports:
              side, round_ = path.split(os.sep)[-3:-1]
              r = json.load(open(path))
              m = r["measured_writes"]
              l = m["committed_latency_ns"]
              rate = r["shape"]["rate"]
              # The counters span the whole load, warm-up included, as do
              # the run's committed writes.
              rows.setdefault(rate, {}).setdefault(side, []).append(
                  (int(round_), m["committed"], m["refused"] + m["unknown"] + m.get("expired", 0),
                   l["p50"] / 1000, l["p99"] / 1000, l["p999"] / 1000, cpu(path, r["committed"])))
          print("| offered/s | side | round | committed | refused | p50 µs | p99 µs | p99.9 µs | busiest node CPU µs/write | all nodes CPU µs/write | busiest node busy % | its quota held, ms |")
          print("|---|---|---|---|---|---|---|---|---|---|---|---|")
          for rate in sorted(rows):
              for side in ("a", "b"):
                  for row in sorted(rows[rate].get(side, []), key=lambda x: x[0]):
                      c = " | ".join(f"{v:,.0f}" for v in row[6]) if row[6] else "– | – | – | –"
                      print(f"| {rate} | {side} | {row[0]} | {row[1]:,} | {row[2]:,} | {row[3]:,.0f} | {row[4]:,.0f} | {row[5]:,.0f} | {c} |")
          print()
          print("| offered/s | median committed A → B | median p99 µs A → B | median busiest node CPU µs/write A → B |")
          print("|---|---|---|---|")
          for rate in sorted(rows):
              a = rows[rate].get("a", [])
              b = rows[rate].get("b", [])
              if a and b:
                  ca, cb = statistics.median(x[1] for x in a), statistics.median(x[1] for x in b)
                  pa, pb = statistics.median(x[4] for x in a), statistics.median(x[4] for x in b)
                  ua = [x[6][0] for x in a if x[6]]
                  ub = [x[6][0] for x in b if x[6]]
                  u = f"{statistics.median(ua):,.0f} → {statistics.median(ub):,.0f}" if ua and ub else "–"
                  print(f"| {rate} | {ca:,.0f} → {cb:,.0f} | {pa:,.0f} → {pb:,.0f} | {u} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: tools/compare/compose/reports
