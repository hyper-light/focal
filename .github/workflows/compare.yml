name: Competitive tail latency

# docs/qualification/competitive-p99.md: focal, Kafka, NATS JetStream and Redis
# on equal terms, every acknowledged write on disk at a quorum, on a Linux
# runner whose fsync reaches its disk (Docker Desktop's VM does not). Run by
# hand: each system is three containers at one CPU each beside the generator.
# Every system is measured on the same runner, one after another: the hosted
# runners come with different disks (a network-attached virtual disk, or a
# local NVMe), and a matrix gave each system a runner of its own — focal and
# Redis on the virtual disk while Kafka and NATS had NVMe in one run, which
# measured the disks and not the systems.
on:
  # A branch named compare/<anything> runs it with the defaults below, which
  # starts a run without the workflow on the default branch.
  push:
    branches: ["compare/**"]
  workflow_dispatch:
    inputs:
      rates:
        description: "Offered records a second, space-separated"
        default: "100 200 1000 4000"
      seconds:
        description: "Seconds measured per run"
        default: "60"
      warmup:
        description: "Seconds sent and not measured, first"
        default: "15"
      payload:
        description: "Bytes of each competitor record"
        default: "128"
      systems:
        description: "Systems measured, space-separated, on one runner in turn"
        default: "focal kafka nats redis"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      # The node, focal-load and focal-compare, built as the release's musl lane
      # builds them (tools/compare/compose/focal.Dockerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/compare/compose/focal.Dockerfile
          tags: focal:bench
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save focal:bench | zstd -T0 -3 > focal-bench.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: focal-bench-image
          path: focal-bench.tar.zst
          retention-days: 3

  measure:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: focal-bench-image
      - run: zstd -dc focal-bench.tar.zst | docker load
      - name: Let perf sample a container's process
        run: sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
      - name: The disk the runs write to
        run: |
          mkdir -p tools/compare/compose/reports
          {
            df -h /var/lib/docker || df -h /
            lsblk -o NAME,ROTA,SIZE,MODEL || true
            # 500 synchronous 4 KiB writes: whether fsync reaches the device
            # here; then three writers at once, as a system's three nodes are.
            echo "one writer:"
            dd if=/dev/zero of=/tmp/dsync bs=4k count=500 oflag=dsync 2>&1 | tail -1
            echo "three writers at once:"
            for i in 1 2 3; do
              dd if=/dev/zero of=/tmp/dsync$i bs=4k count=500 oflag=dsync 2>&1 | tail -1 &
            done
            wait
            rm -f /tmp/dsync /tmp/dsync1 /tmp/dsync2 /tmp/dsync3
          } | tee tools/compare/compose/reports/disk.txt
      - name: Runs
        env:
          NODE_CPUS: "1"
        run: |
          for system in ${{ github.event.inputs.systems || 'focal' }}; do
            for rate in ${{ github.event.inputs.rates || '1000 4000' }}; do
              bash tools/compare/compose/run.sh "$system" "$rate" \
                "${{ github.event.inputs.seconds || '60' }}" \
                "${{ github.event.inputs.warmup || '15' }}" \
                "${{ github.event.inputs.payload || '128' }}" reports
            done
          done
      - name: One table, every system, one runner
        if: always()
        run: |
          {
            echo '```'
            cat tools/compare/compose/reports/disk.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          rows = []
          legacy_focal = False
          for path in sorted(glob.glob("tools/compare/compose/reports/*.json")):
              r = json.load(open(path))
              name = os.path.basename(path)[:-5]
              if "latency_ns" in r:  # focal-load
                  m = r.get("measured_writes")
                  if m is None:
                      legacy_focal = True
                  l = m["committed_latency_ns"] if m is not None else r["latency_ns"]
                  counts = m if m is not None else r
                  us = lambda v: v / 1000
                  rows.append((name, r["shape"].get("rate"), counts["committed"], counts["refused"] + counts["unknown"] + counts.get("expired", 0),
                               us(l["p50"]), us(l["p99"]), us(l["p999"]), us(l["max"])))
              elif "offered_per_second" in r:  # focal-compare
                  rows.append((name, r["offered_per_second"], r["acknowledged"], r["failed"] + r["refused_by_generator"],
                               r["p50_us"], r["p99_us"], r["p999_us"], r["max_us"]))
          print("| run | offered/s | acknowledged | failed or refused | p50 µs | p99 µs | p99.9 µs | max µs |")
          print("|---|---|---|---|---|---|---|---|")
          for row in rows:
              print("| " + " | ".join(f"{v:,.0f}" if isinstance(v, float) else str(v) for v in row) + " |")
          if legacy_focal:
              print("\nOlder focal reports contain all-attempt latency and whole-phase counts; refusals and warm-up can skew those rows.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: tools/compare/compose/reports
