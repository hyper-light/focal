name: Competitive tail latency

# docs/qualification/competitive-p99.md: focal, Kafka, NATS JetStream and Redis
# on equal terms, every acknowledged write on disk at a quorum, on a Linux
# runner whose fsync reaches its disk (Docker Desktop's VM does not). Run by
# hand: each system is three containers at one CPU each beside the generator.
# Every system is measured on the same runner, one after another: the hosted
# runners come with different disks (a network-attached virtual disk, or a
# local NVMe), and a matrix gave each system a runner of its own — focal and
# Redis on the virtual disk while Kafka and NATS had NVMe in one run, which
# measured the disks and not the systems.
on:
  # A branch named compare/<anything> runs it with the defaults below, which
  # starts a run without the workflow on the default branch; one named
  # compare/deliver-<anything> runs the deliver mode at its own rates, and one
  # named compare/work-<anything> focal's work mode among 500 agents.
  push:
    branches: ["compare/**"]
  workflow_dispatch:
    inputs:
      rates:
        description: "Offered records a second, space-separated; 0, a closed loop (each answer sends the next record) for a ceiling"
        default: "100 200 1000 4000"
      windows:
        description: "Generator windows (requests out at most), space-separated, each run at each; empty, the generator's 4096 (focal-load keeps its own callers)"
        default: ""
      seconds:
        description: "Seconds measured per run"
        default: "60"
      warmup:
        description: "Seconds sent and not measured, first"
        default: "15"
      payload:
        description: "Bytes of each competitor record"
        default: "128"
      systems:
        description: "Systems measured, space-separated, on one runner in turn"
        default: "focal kafka nats redis"
      mode:
        description: "append (each record stored), deliver (each also consumed and acknowledged durably, a work queue's message end to end) or work (focal alone: each claim posted, worked, handed in, judged and settled among three of the agents, eleven writes)"
        default: "append"
      agents:
        description: "deliver mode on focal: the messages go among this many enrolled agents, each a client of its own (focal-load's agents, 2..=4094); empty, one issuer and one consumer"
        default: ""
      faults:
        description: "focal: what the cluster suffers while each load runs (run.sh FAULTS), e.g. 'netem=delay 80ms 30ms loss 3%;kill=focal2@40+30;isolate=focal3@100+20'; empty, none"
        default: ""

permissions:
  contents: read
  # The pinned images copied into the repository's own registry (mirror.sh).
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    # The build, and the mirror's copies waiting out a registry's rate limit.
    timeout-minutes: 150
    outputs:
      registry: ${{ steps.mirror.outputs.BENCH_REGISTRY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every pinned image copied by digest into the repository's registry, once:
      # anonymous pulls from public registries share the runners' limits.
      - id: mirror
        run: bash tools/compare/compose/mirror.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/focal-bench" >> "$GITHUB_OUTPUT"
      # The node, focal-load and focal-compare, built as the release's musl lane
      # builds them (tools/compare/compose/focal.Dockerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/compare/compose/focal.Dockerfile
          tags: focal:bench
          load: true
          build-args: BASE=${{ steps.mirror.outputs.BENCH_REGISTRY || 'public.ecr.aws/docker/library' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save focal:bench | zstd -T0 -3 > focal-bench.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: focal-bench-image
          path: focal-bench.tar.zst
          retention-days: 3

  measure:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: focal-bench-image
      - run: zstd -dc focal-bench.tar.zst | docker load
      - uses: docker/login-action@v3
        if: needs.image.outputs.registry != ''
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The disk the runs write to
        run: |
          mkdir -p tools/compare/compose/reports
          {
            df -h /var/lib/docker || df -h /
            lsblk -o NAME,ROTA,SIZE,MODEL || true
            # The processor the runs share: hosted runners come with different ones, whose cost a
            # write differs by half again (focal's work mode, 2026-10-27), so a run is read beside
            # its processor.
            grep -m1 'model name' /proc/cpuinfo || true
            nproc || true
            # 500 synchronous 4 KiB writes: whether fsync reaches the device
            # here; then three writers at once, as a system's three nodes are.
            echo "one writer:"
            dd if=/dev/zero of=/tmp/dsync bs=4k count=500 oflag=dsync 2>&1 | tail -1
            echo "three writers at once:"
            for i in 1 2 3; do
              dd if=/dev/zero of=/tmp/dsync$i bs=4k count=500 oflag=dsync 2>&1 | tail -1 &
            done
            wait
            rm -f /tmp/dsync /tmp/dsync1 /tmp/dsync2 /tmp/dsync3
          } | tee tools/compare/compose/reports/disk.txt
      - name: Runs
        env:
          NODE_CPUS: "1"
          MODE: ${{ github.event.inputs.mode || (startsWith(github.ref_name, 'compare/deliver') && 'deliver' || (startsWith(github.ref_name, 'compare/work') && 'work' || 'append')) }}
          AGENTS: ${{ github.event.inputs.agents || (startsWith(github.ref_name, 'compare/work') && '500' || '') }}
          FAULTS: ${{ github.event.inputs.faults || '' }}
          # The competitors' images from the repository's registry where the image
          # job copied them (compose.yaml's defaults are the public sources).
          BENCH_LIBRARY: ${{ needs.image.outputs.registry || 'public.ecr.aws/docker/library' }}
          BENCH_KAFKA: ${{ needs.image.outputs.registry && format('{0}/kafka', needs.image.outputs.registry) || 'apache/kafka' }}
        run: |
          for system in ${{ github.event.inputs.systems || (startsWith(github.ref_name, 'compare/work') && 'focal' || 'focal kafka nats redis') }}; do
            for rate in ${{ github.event.inputs.rates || (startsWith(github.ref_name, 'compare/deliver') && '50 100 200 400' || (startsWith(github.ref_name, 'compare/work') && '100' || '100 200 1000 4000')) }}; do
              for window in ${{ github.event.inputs.windows || '-' }}; do
                if [ "$window" = - ]; then
                  unset INFLIGHT
                else
                  # focal-load paces its own callers: it has no closed loop and no window.
                  if [ "$system" = focal ]; then continue; fi
                  export INFLIGHT="$window"
                fi
                if [ "$system" = focal ] && [ "$rate" = 0 ]; then continue; fi
                bash tools/compare/compose/run.sh "$system" "$rate" \
                  "${{ github.event.inputs.seconds || '60' }}" \
                  "${{ github.event.inputs.warmup || '15' }}" \
                  "${{ github.event.inputs.payload || '128' }}" reports
              done
            done
          done
      - name: One table, every system, one runner
        if: always()
        run: |
          {
            echo '```'
            cat tools/compare/compose/reports/disk.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          def cpu(path, writes):
              """The nodes' CPU over a run, from run.sh's cgroup counters taken
              before and after the load: the busiest node's and all nodes'
              microseconds per write and the busiest node's share of the wall
              clock. Dashes where no counters were taken."""
              seen = {}
              try:
                  lines = open(path + ".cpu.txt").read().splitlines()
              except OSError:
                  lines = []
              for line in lines:
                  parts = line.split()
                  if len(parts) == 4 and parts[3].isdigit():
                      phase, container, key, value = parts
                      seen.setdefault(container, {}).setdefault(key, {})[phase] = int(value)
              delta = {c: {k: v["after"] - v["before"] for k, v in keys.items() if len(v) == 2}
                       for c, keys in seen.items()}
              wall = delta.pop("-", {}).get("wall_usec", 0)
              nodes = [d["usage_usec"] for c, d in delta.items()
                       if "usage_usec" in d and "focal-load" not in c and "generator" not in c]
              if not nodes or writes <= 0 or wall <= 0:
                  return ("–", "–", "–")
              return (max(nodes) / writes, sum(nodes) / writes, 100 * max(nodes) / wall)
          def apart(path):
              """What else could have been the run's ceiling: the generator's
              share of the wall clock (a generator at its CPUs measured itself),
              and the busiest disk's (run.sh's /proc/diskstats counters; its
              three nodes share it). Dashes where no counters were taken."""
              def deltas(suffix):
                  seen = {}
                  try:
                      lines = open(path + suffix).read().splitlines()
                  except OSError:
                      lines = []
                  for line in lines:
                      parts = line.split()
                      if len(parts) == 4 and parts[3].isdigit():
                          phase, name, key, value = parts
                          seen.setdefault(name, {}).setdefault(key, {})[phase] = int(value)
                  return {n: {k: v["after"] - v["before"] for k, v in keys.items() if len(v) == 2}
                          for n, keys in seen.items()}
              cpus = deltas(".cpu.txt")
              wall = cpus.pop("-", {}).get("wall_usec", 0)
              if wall <= 0:
                  return ("–", "–")
              generator = [d["usage_usec"] for c, d in cpus.items() if "generator" in c and "usage_usec" in d]
              disks = deltas(".disk.txt")
              busiest = max(disks.values(), key=lambda d: d.get("sectors_written", 0), default=None)
              return (100 * sum(generator) / wall if generator else "–",
                      100 * busiest["busy_ms"] * 1000 / wall if busiest and "busy_ms" in busiest else "–")
          rows = []
          legacy_focal = False
          for path in sorted(glob.glob("tools/compare/compose/reports/*.json")):
              r = json.load(open(path))
              name = os.path.basename(path)[:-5]
              if "latency_ns" in r:  # focal-load
                  m = r.get("measured_writes")
                  if m is None:
                      legacy_focal = True
                  l = m["committed_latency_ns"] if m is not None else r["latency_ns"]
                  counts = m if m is not None else r
                  us = lambda v: v / 1000
                  # The CPU counters span the whole load, warm-up included,
                  # as do the run's committed writes.
                  rows.append((name, r["shape"].get("rate"), "–", counts["committed"], "–", counts["refused"] + counts["unknown"] + counts.get("expired", 0),
                               us(l["p50"]), us(l["p99"]), us(l["p999"]), us(l["max"])) + cpu(path, r["committed"]) + apart(path))
              elif "offered_per_second" in r:  # focal-compare
                  # Every write it sent, warm-up included, as the counters span.
                  # A rate of zero is the closed loop: its achieved rate is the ceiling at its window.
                  rows.append((name, r["offered_per_second"] or "closed", r.get("window", "–"), r["acknowledged"], r["achieved_per_second"],
                               r["failed"] + r["refused_by_generator"],
                               r["p50_us"], r["p99_us"], r["p999_us"], r["max_us"]) + cpu(path, r["sent"]) + apart(path))
          print("| run | offered/s | window | acknowledged | achieved/s | failed or refused | p50 µs | p99 µs | p99.9 µs | max µs | busiest node CPU µs/write | all nodes CPU µs/write | busiest node busy % | generator busy % | disk busy % |")
          print("|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|")
          for row in rows:
              print("| " + " | ".join(f"{v:,.0f}" if isinstance(v, float) else str(v) for v in row) + " |")
          if legacy_focal:
              print("\nOlder focal reports contain all-attempt latency and whole-phase counts; refusals and warm-up can skew those rows.")
          # Deliver mode: each message from its intended send time to its consumer's
          # acknowledgement confirmed (focal: the testament posted; satisfied as well).
          delivered = []
          # A deliver run among agents names its agents after the mode (`-deliver-agents1000`);
          # a work run likewise (`-work-agents500`), each claim's satisfaction its delivery.
          for path in sorted(glob.glob("tools/compare/compose/reports/*-deliver*.json")
                             + glob.glob("tools/compare/compose/reports/*-work*.json")):
              r = json.load(open(path))
              d = r.get("deliver")
              if not d:
                  continue
              name = os.path.basename(path)[:-5]
              if "latency_ns" in r:  # focal-load
                  h, f = d["handled_latency_ns"], d["satisfied_latency_ns"]
                  ms = lambda v: v / 1e6
                  delivered.append((name, r["shape"].get("rate"), d["delivered"], d["undelivered"] + r["refused"] + r["unknown"] + r["abandoned"],
                                    ms(h["p50"]), ms(h["p99"]), ms(h["p999"]), ms(f["p50"]), ms(f["p99"]), ms(f["p999"]))
                                   + cpu(path, max(r["lifecycles"], 1))[:2])
              else:  # focal-compare
                  ms = lambda v: v / 1e3
                  delivered.append((name, r["offered_per_second"], d["delivered"], d["undelivered"] + d["failed"],
                                    ms(d["p50_us"]), ms(d["p99_us"]), ms(d["p999_us"]), "–", "–", "–")
                                   + cpu(path, max(r["sent"], 1))[:2])
          if delivered:
              print("\n### Delivered end to end (deliver and work modes)\n")
              print("| run | offered msg/s | delivered | undelivered or failed | acked p50 ms | p99 ms | p99.9 ms | focal satisfied p50 ms | p99 ms | p99.9 ms | busiest node CPU µs/msg | all nodes CPU µs/msg |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|")
              for row in delivered:
                  print("| " + " | ".join(f"{v:,.1f}" if isinstance(v, float) else str(v) for v in row) + " |")
          PY
      - name: What each faulted run suffered
        if: always()
        run: |
          for log in tools/compare/compose/reports/*.faults.txt; do
            [ -f "$log" ] || continue
            {
              echo
              echo "### Faults: $(basename "$log" .faults.txt)"
              echo
              echo '```'
              cat "$log"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Where each tail fell, beside the nodes' events
        if: always()
        run: |
          {
            echo
            echo "### Tails in time"
            echo
            python3 tools/compare/tails.py tools/compare/compose/reports
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: tools/compare/compose/reports
