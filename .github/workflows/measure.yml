name: Owner measurements

# Diagnostic, not for merge: the session owner's isolated path, profiled as the
# cluster's nodes are (musl, mimalloc, frame pointers, perf at 499 Hz with fp call
# graphs, every sample's stack folded root first), to set beside the cluster's
# folded stacks of the same code: the cluster's owner spends 406-563 µs a write in
# `propose_native_frame` where the isolated path takes about 150 µs.
on:
  push:
    branches: ["measure/**"]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The processor
        run: lscpu | head -25; nproc
      - name: Perf may sample
        run: sudo sysctl kernel.perf_event_paranoid=1
      - name: The isolated path in the release's lane, profiled
        run: |
          docker run --rm --cap-add SYS_ADMIN --cap-add PERFMON -v "$PWD":/src -w /src \
            public.ecr.aws/docker/library/rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f \
            sh -c 'fold_stacks() { perf script -i "$1" -F comm,ip,sym 2>/dev/null | awk "
                   function emit(  s, i) { if (n == 0) return; s = comm; for (i = n; i >= 1; i--) s = s \";\" f[i]; c[s]++; n = 0 }
                   /^\t/ { n++; sym = \$2; for (j = 3; j <= NF; j++) sym = sym \" \" \$j; f[n] = sym; next }
                   /^[ \t]*\$/ { emit(); next }
                   { emit(); comm = \$1; next }
                   END { emit(); for (k in c) print k, c[k] }
                 " > "$2"; wc -l "$2"; }; \
              apk add --no-cache build-base protoc bash perl linux-headers perf > /dev/null \
              && export RUSTFLAGS="-C target-feature=+crt-static -C force-frame-pointers=yes" CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
              && cargo test --release --locked -p focal-core --lib --target x86_64-unknown-linux-musl --features diag-mimalloc --no-run 2>&1 | tail -2 \
              && bin=$(ls -t target/x86_64-unknown-linux-musl/release/deps/focal_core-* | grep -v "\.d$" | head -1) \
              && echo "binary $bin" \
              && FOCAL_MEASURE_PAGE_BYTES=4096 FOCAL_MEASURE_CLAIMS=50000 perf record -F 499 --call-graph fp -o /src/authored.perf -- \
                   "$bin" --ignored --nocapture --test-threads=1 measure_time_per_authored_claim 2>&1 | grep -E "claims: prepare|samples" \
              && fold_stacks /src/authored.perf /src/authored.folded \
              && perf record -F 499 --call-graph fp -o /src/decode.perf -- \
                   "$bin" --ignored --nocapture --test-threads=1 measure_time_to_decode_an_authored_frame 2>&1 | grep -E "µs|samples" \
              && fold_stacks /src/decode.perf /src/decode.folded \
              && perf report -i /src/authored.perf --stdio --children --sort symbol -g none --percent-limit 1 2>/dev/null | grep -v "^#" | grep -v "^\$" | head -80'
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-folded
          path: |
            authored.folded
            decode.folded
