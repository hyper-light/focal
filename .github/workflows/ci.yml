name: Rust contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Install pinned dependency auditor
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies
        run: cargo deny check advisories bans licenses sources
  model:
    # The fast track's model (docs/models/FastTrack.tla): every state of the
    # configurations a change is checked with, each within the states it
    # states, and the rules the core does not follow, which the checker must
    # refuse.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The runner does nothing else.
      TLC_WORKERS: auto
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Java
        run: java -version
      - name: Check the model, one index
        run: bash scripts/check-model.sh
      - name: Check the model, two indexes
        run: bash scripts/check-model.sh round
      - name: The checker finds an index committed by what members hold
        run: bash scripts/check-model.sh reached
      - name: The checker refuses the wrong rule
        run: bash scripts/check-model.sh wrong
      - name: The checker refuses a fast quorum counted without its round
        run: bash scripts/check-model.sh anyround
      - name: Check the model, the same four voters with the round counted
        run: bash scripts/check-model.sh four
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install native protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install native protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Verify source and schema contracts
        run: python3 scripts/check-contracts.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: bash scripts/cargo.sh clippy --workspace --all-targets --locked -- -D warnings
      - name: Production panic policy
        run: bash scripts/check-production.sh
      - name: Tests
        # Bound test parallelism to match the release workflow: the multi-node
        # fleet and runbook tests each spawn several node processes, so running
        # every test binary at once oversubscribes memory and the node correctly
        # refuses admission at capacity, failing a test that is otherwise sound.
        run: bash scripts/cargo.sh test --workspace --locked -- --test-threads=4
      - name: Release build
        run: bash scripts/cargo.sh build --release --workspace --locked
