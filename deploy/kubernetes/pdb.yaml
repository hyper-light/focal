apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: focal-founder
  namespace: focal
  labels:
    app.kubernetes.io/name: focal
    app.kubernetes.io/managed-by: focal-deployment-render
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: focal
      app.kubernetes.io/component: founder
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: focal-hosts
  namespace: focal
  labels:
    app.kubernetes.io/name: focal
    app.kubernetes.io/managed-by: focal-deployment-render
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: focal
      app.kubernetes.io/component: host
