apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: focal-c
  namespace: focal
  labels:
    app.kubernetes.io/name: focal
    app.kubernetes.io/component: host
    app.kubernetes.io/managed-by: focal-deployment-render
    focal.dev/set: focal-c
  annotations:
    focal.dev/qualification: unqualified-bootstrap-allocation
spec:
  serviceName: focal
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: focal
      focal.dev/set: focal-c
  template:
    metadata:
      labels:
        app.kubernetes.io/name: focal
        app.kubernetes.io/component: host
        focal.dev/set: focal-c
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - "c"
      initContainers:
        - name: prepare-volume
          image: focal:0.1.0
          command: ["/focal"]
          args: ["--data-dir", "/var/lib/focal", "prepare-volume", "--owner", "65532:65532"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/focal
      containers:
        - name: focal
          image: focal:0.1.0
          command: ["/focal"]
          args:
            - "--config"
            - "/etc/focal/focal.yaml"
            - "--data-dir"
            - "/var/lib/focal"
            - "start"
            - "--listen"
            - "0.0.0.0:7443"
            - "--advertise"
            - "$(POD_NAME).focal.$(POD_NAMESPACE).svc.cluster.local:7443"
            - "--invite-file"
            - "/etc/focal/invitations/$(POD_NAME).invite"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: peer
              containerPort: 7443
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command: ["/focal", "--data-dir", "/var/lib/focal", "cluster", "node", "probe", "--check", "alive"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/focal", "--data-dir", "/var/lib/focal", "cluster", "node", "probe", "--check", "alive"]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/focal", "--data-dir", "/var/lib/focal", "cluster", "node", "probe", "--check", "alive"]
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/focal
            - name: config
              mountPath: /etc/focal/focal.yaml
              subPath: focal.yaml
              readOnly: true
            - name: invitations
              mountPath: /etc/focal/invitations
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: focal-config
            items:
              - key: focal-c.yaml
                path: focal.yaml
        - name: invitations
          secret:
            secretName: focal-invitations
            defaultMode: 288
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
