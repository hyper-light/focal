[package]
name = "focal-compare"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false
description = "Open-loop tail-latency comparison of durable replicated appends (docs/qualification/competitive-p99.md); a measurement tool, never shipped."

[lints]
workspace = true

[[bin]]
name = "focal-compare"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The event bus's client (`pubsub` against focal-bus), its corpus and its runtime.
focal-bus = { version = "0.1.0", path = "../../crates/focal-bus" }
focal-rt = { version = "0.1.0", path = "../../crates/focal-rt" }
focal-memory = { version = "0.1.0", path = "../../crates/focal-memory" }
# The machine's envelope a client's endpoints are charged within, as a node's are.
focal-platform = { version = "0.1.0", path = "../../crates/focal-platform" }
hyper-quic = { workspace = true }
hyper-rt = { workspace = true }
hyper-rt-transport = { workspace = true }
hyper-transport = { workspace = true }
# The corpus's codec, as a claimant compresses (doc 32 §4.1).
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
hdrhistogram = { version = "7.6", default-features = false }
# The NATS consumer's message stream (`deliver`).
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# One cryptographic provider (F57): aws-lc-rs, never ring.
async-nats = { version = "0.50", default-features = false, features = ["aws-lc-rs", "jetstream", "server_2_12"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
# Kafka's canonical high-performance client (librdkafka, built from its
# vendored source): no TLS, no SASL, no compression codecs; plaintext on the
# bench network.
rdkafka = { version = "0.39", default-features = false, features = ["tokio"] }

# On Windows librdkafka builds with CMake (installed on the CI runners): its
# autotools `./configure` is a shell script Windows cannot run. Elsewhere the
# autotools build needs no tool beyond a C compiler.
[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build"] }
