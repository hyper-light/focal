# NATS JetStream node (docs/qualification/competitive-p99.md). SYNC is "always"
# for the durable row, "2m" (the shipped default) otherwise.
port: 4222
server_name: $NAME
jetstream {
  store_dir: /data
  sync_interval: $SYNC
}
cluster {
  name: bench
  listen: 0.0.0.0:6222
  routes: [nats://nats1:6222, nats://nats2:6222, nats://nats3:6222]
}
