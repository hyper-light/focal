[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "all"
# No advisory is suppressed. Reachability reviews live in docs/dependencies.

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.93

# One crate, one license: `xxhash-rust` (Boost Software License 1.0: permissive, OSI approved, FSF free) is a
# required dependency of `redis`, which only the competitive-latency harness `tools/compare` uses. No shipped
# binary links it. See docs/dependencies/README.md.
[[licenses.exceptions]]
allow = ["BSL-1.0"]
crate = "xxhash-rust"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tikv/raft-rs"]
required-git-spec = "rev"
